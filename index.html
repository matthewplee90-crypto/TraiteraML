const STYLE={D:{name:'Eagle',label:'Drive',color:'#f0b765',short:'Direction and momentum',headline:'The decisive force',intro:'You tend to move toward decisions, responsibility and tangible outcomes.',strengths:[['Decisive ownership','You are willing to make the call when a group needs direction.'],['Momentum building','You tend to turn ambiguity into an actionable next step.'],['Constructive challenge','You may be comfortable confronting difficult issues rather than avoiding them.'],['Commercial focus','You naturally look for outcomes, accountability and progress.']],risks:[['Running ahead of others','Your pace may leave collaborators without sufficient information or buy-in.'],['Unintended bluntness','Clear, efficient communication can sometimes feel abrupt to others.'],['Taking on too much','A preference for control can make delegation more difficult.'],['Overweighting speed','Complex decisions sometimes need more exploration before action.']],careers:[['Operations and general management','Ownership, accountability and decisiveness can be useful in operational leadership.'],['Business development leadership','Initiative and a focus on commercial outcomes can support this work.'],['Project delivery','Clear decisions and coordinated action are valuable when timelines are tight.'],['Entrepreneurship','Ambiguity, ownership and rapid iteration can appeal to this style.']],work:['Clear decision rights and measurable objectives','Freedom to act once expectations are established','Work that rewards initiative and improvement'],friction:['Unclear responsibility or circular discussions','Excessive approvals without an obvious purpose','Avoidance of necessary difficult conversations'],communication:'Lead with the conclusion, the decision needed and what happens next.',relationship:'Your directness can be a gift when it provides clarity. Make time to ask how your approach affects the other person.',pressure:'Under pressure, you may feel an urge to accelerate, take control or function buildQuestions(mode){
 const questions=[];const coreIndexes=mode==='quick'?[0,1,4,5]:[0,1,2,3,4,5,6,7];
 coreIndexes.forEach((idx)=>['D','I','S','C'].forEach(t=>questions.push({id:'core-'+t+'-'+idx,section:'core',group:t,reverse:CORE[t][idx][1],prompt:CORE[t][idx][0]})));

 contextIndexes.forEach(idx=>Object.entries(CONTEXT).forEach(([k,v])=>questions.push({id:'context-'+k+'-'+idx,section:'context',group:k,reverse:v.items[idx][1],prompt:v.items[idx][0]})));
 const pressureIndexes=mode==='quick'?[0,2]:[0,1,2,3];
 pressureIndexes.forEach(idx=>['D','I','S','C'].forEach(t=>questions.push({id:'pressure-'+t+'-'+idx,section:'pressure',group:t,reverse:PRESSURE[t][idx][1],prompt:PRESSURE[t][idx][0]})));
 (mode==='quick'?[0,2,4,6]:[0,1,2,3,4,5,6,7]).forEach(idx=>questions.push({id:'scenario-'+idx,section:'scenario',prompt:SCENARIOS[idx].prompt,choices:SCENARIOS[idx].choices}));
 return questions;
}
function getPhase(section){return {core:['Part 1 of 4','Everyday tendencies','Think about what you usually do, not how you want to be seen.'],context:['Part 2 of 4','How you make decisions','Choose what is generally true for you, not what seems ideal.'],pressure:['Part 3 of 4','Under pressure','Think about your typical response during demanding periods.'],scenario:['Part 4 of 4','Real-world situations','Select the instinctive first response. Several options may be reasonable.']}[section]}
function getScore(questions,answers,section,group){const selected=questions.filter(q=>q.section===section&&q.group===group);if(!selected.length)return 50;return Math.round(100*selected.reduce((sum,q)=>sum+((q.reverse?6-Number(answers[q.id]):Number(answers[q.id]))-1),0)/(selected.length*4))}
function calculate(sessionData){const questions=buildQuestions(sessionData.mode);const answers=sessionData.answers;let core={},ctx={},pressure={};['D','I','S','C'].forEach(t=>{core[t]=getScore(questions,answers,'core',t);pressure[t]=getScore(questions,answers,'pressure',t)});Object.keys(CONTEXT).forEach(k=>ctx[k]=getScore(questions,answers,'context',k));let scenarios={D:0,I:0,S:0,C:0};questions.filter(q=>q.section==='scenario').forEach(q=>{scenarios[answers[q.id]]=(scenarios[answers[q.id]]||0)+1});let sorted=['D','I','S','C'].sort((a,b)=>core[b]-core[a]||'DISC'.indexOf(a)-'DISC'.indexOf(b));const strong=sorted[0],secondary=sorted[1],blend=BLENDS[strong+secondary]||[STYLE[strong].headline,STYLE[strong].intro];return {core,ctx,pressure,scenarios,sorted,strong,secondary,blend,questions:questions.length}}

 magician:[['When excited about major change, I may understate how much practical work it requires.',0],['I am comfortable discovering that an inspiring idea is not workable.',1]],
 creator:[['Fear that my work is not good enough sometimes stops me from sharing it.',0],['I can enjoy completing a basic version without perfecting every detail.',1]],
 lover:[['When an important connection feels uncertain, I seek reassurance repeatedly.',0],['I can accept closeness without needing to agree on everything.',1]],

function archetypeQuestions(mode){const qs=[];const indices=mode==='quick'?[0,2,3]:[0,1,2,3,4,5];indices.forEach(i=>AR_ORDER.forEach(k=>qs.push({id:'arch-core-'+k+'-'+i,section:'arcore',group:k,reverse:AR_ITEMS[k][i][1],prompt:AR_ITEMS[k][i][0]})));(mode==='quick'?[0]:[0,1]).forEach(i=>AR_ORDER.forEach(k=>qs.push({id:'arch-shadow-'+k+'-'+i,section:'arshadow',group:k,reverse:AR_SHADOW[k][i][1],prompt:AR_SHADOW[k][i][0]})));return qs}
function archetypeCalculate(s){const q=archetypeQuestions(s.mode),scores={},shadow={};AR_ORDER.forEach(k=>{scores[k]=getScore(q,s.answers,'arcore',k);shadow[k]=getScore(q,s.answers,'arshadow',k)});const sorted=[...AR_ORDER].sort((a,b)=>scores[b]-scores[a]||AR_ORDER.indexOf(a)-AR_ORDER.indexOf(b));const groups={leadership:['ruler','hero','sage'],transformation:['magician','creator','rebel'],connection:['lover','caregiver','everyperson'],freedom:['explorer','jester','innocent']};const clusters=Object.fromEntries(Object.entries(groups).map(([k,keys])=>[k,Math.round(keys.reduce((sum,key)=>sum+scores[key],0)/keys.length)]));return {assessment:'archetypes',scores,shadow,sorted,dominant:sorted[0],supporting:sorted[1],third:sorted[2],clusters,questions:q.length,shadowCount:s.mode==='quick'?1:2}}
function archetypeAcross(r){const f=db.reports.filter(x=>x.assessment!=='archetypes'&&x.core&&x.id!==r.id).sort((a,b)=>b.date-a.date)[0];if(!f)return `<div class="story-card" style="margin-top:16px"><span class="smallcaps">EXPLORE THE OTHER SIDE</span><h3>How do your motivations connect to your behaviour?</h3><p>Archetype Atlas maps the motives behind your choices. FLIGHT completes the picture by showing how you communicate, decide and handle pressure.</p><button class="btn secondary sm" data-open-assessment="flight">Explore FLIGHT ${icon('arrow',15)}</button></div>`;const fs=STYLE[f.strong||'D'],ft=STYLE[f.secondary||'I'];return `<div class="story-card" style="margin-top:16px"><span class="smallcaps">CONNECTED INSIGHTS · YOUR TWO ASSESSMENTS</span><h3>What you do, and what might drive it</h3><div class="report-grid equal"><div><p class="fine">YOUR FLIGHT BEHAVIOURAL STYLE</p><h3>${fs.name} + ${ft.name}</h3><p>Leading scores: ${f.core[f.strong]}/100 and ${f.core[f.secondary]}/100</p></div><div><p class="fine">YOUR ARCHETYPE MOTIVATIONS</p><h3>${ARCHETYPES[r.dominant].name} + ${ARCHETYPES[r.supporting].name}</h3><p>Leading scores: ${r.scores[r.dominant]}/100 and ${r.scores[r.supporting]}/100</p></div></div><p>Here is your pattern in motion: FLIGHT captures how you naturally operate; Archetype Atlas reveals what pulls you forward. Together they explain the style you bring into conversations, decisions and challenges.</p><button class="btn secondary sm" data-report="${f.id}">Open FLIGHT report ${icon('arrow',15)}</button></div>`}
function flightAcross(r){const a=db.reports.filter(x=>x.assessment==='archetypes'&&x.scores).sort((x,y)=>y.date-x.date)[0];if(!a)return '';return `<div class="story-card" style="margin-top:17px"><span class="smallcaps">CONNECTED INSIGHTS · ARCHETYPE ATLAS</span><h3>What might motivate your ${STYLE[r.strong].name} style?</h3><p>Your behavioural signature is <strong>${STYLE[r.strong].name} + ${STYLE[r.secondary].name}</strong>. Your leading archetypes, <strong>${ARCHETYPES[a.dominant].name}</strong> and <strong>${ARCHETYPES[a.supporting].name}</strong>, reveal the motivations that give that style its energy.</p><p>${ARCHETYPES[a.dominant].need} That drive gives your communication and decision-making style a clear sense of purpose.</p><p class="fine">Two distinct views of the same person: how you move through the world and the stories that give your choices meaning.</p><button class="btn secondary sm" data-report="${a.id}">View Archetype Atlas ${icon('arrow',15)}</button></div>`}
function arIcon(k){return ({ruler:'shield',hero:'target',sage:'brain',magician:'spark',creator:'layers',lover:'users',caregiver:'shield',explorer:'compass',rebel:'bolt',jester:'spark',innocent:'sun',everyperson:'users'})[k]}
function arBar(k,score){return `<div class="archbar"><div class="archbar-name rich">${variablePill('archetypes',k,ARCHETYPES[k].tag)}</div><div class="archbar-line"><span style="width:${score}%;background:${ARCHETYPES[k].color}"></span></div><b class="arch-num">${score}</b></div>`}
function arPolar(r){const cx=190,cy=186,R=134,n=12,at=(i,p)=>{const theta=2*Math.PI*i/n-Math.PI/2;return [cx+R*p*Math.cos(theta),cy+R*p*Math.sin(theta)]};const str=p=>AR_ORDER.map((k,i)=>at(i,p).join(',')).join(' ');return `<svg class="arch-radar" viewBox="0 0 380 375" role="img" aria-label="Twelve axis radar chart of archetype response indices">${[.25,.5,.75,1].map(v=>`<polygon points="${str(v)}" fill="none" stroke="var(--line)" stroke-width="1"/>`).join('')}${AR_ORDER.map((k,i)=>{const [x,y]=at(i,1);return `<line x1="${cx}" y1="${cy}" x2="${x}" y2="${y}" stroke="var(--line)"/>`}).join('')}<polygon points="${AR_ORDER.map((k,i)=>at(i,r.scores[k]/100).join(',')).join(' ')}" fill="rgba(72,219,197,.24)" stroke="#48dbc5" stroke-width="3"/>${AR_ORDER.map((k,i)=>{const [x,y]=at(i,r.scores[k]/100),[tx,ty]=at(i,1.18);return `<circle cx="${x}" cy="${y}" r="3.5" fill="${ARCHETYPES[k].color}"/><text x="${tx}" y="${ty}" text-anchor="middle" dominant-baseline="middle" fill="var(--text)" font-size="10.5" font-weight="700">${ARCHETYPES[k].name}</text>`}).join('')}</svg>`}
function arSectionHead(n,k,title,subtitle){return `<div class="smallcaps">${String(n).padStart(2,'0')} / ${k}</div><h2 style="margin-top:8px">${title}</h2><p>${subtitle}</p>`}
function arList(items){return `<div class="tile-grid">${items.map((item,i)=>`<div class="insight-tile"><div class="index">${String(i+1).padStart(2,'0')}</div><b>${htmlSafe(item[0])}</b><p>${htmlSafe(item[1])}</p></div>`).join('')}</div>`}
function arRetest(r){const prev=db.reports.filter(x=>x.assessment==='archetypes'&&x.id!==r.id&&x.date<r.date&&x.mode===r.mode&&x.context===r.context).sort((a,b)=>b.date-a.date)[0];if(!prev)return '';return `<div class="story-card" style="margin-top:16px"><h3>Compared with ${reportDate(prev.date)}</h3><p>Your strongest motivations have shifted. Compare what moved up, what moved down and what matters most to you now.</p>${r.sorted.slice(0,6).map(k=>`<div class="arch-compare"><b>${ARCHETYPES[k].name}</b><span>Previously ${prev.scores?.[k]??'?'}</span><span>Now ${r.scores[k]}</span></div>`).join('')}</div>`}
const AR_REPORT_SECTIONS=[['aroverview','Overview'],['armap','12-archetype map'],['ardrivers','Motivations & values'],['arshadow','Shadow & stress'],['arstrengths','Strengths & blind spots'],['arrelationship','Relationships'],['arleadership','Work & leadership'],['arcareers','Career themes'],['argrowth','Development plan'],['armethod','Method & limits']];
function renderArchetypesReport(){const r=currentReport||db.reports.find(x=>x.assessment==='archetypes');if(!r)return `<div class="wrap"><p>No archetype report yet.</p></div>`;currentReport=r;const lead=ARCHETYPES[r.dominant],second=ARCHETYPES[r.supporting],third=ARCHETYPES[r.third],spread=r.scores[r.dominant]-r.scores[r.third];const thin=spread<10;const shadowRank=[...AR_ORDER].sort((a,b)=>r.shadow[b]-r.shadow[a]);const shadowTop=shadowRank.filter(k=>r.shadow[k]>=75).slice(0,4);const strengths=[...new Set([...lead.strengths,...second.strengths,...third.strengths])].slice(0,9);const risks=[...new Set([...lead.risks,...second.risks,...third.risks])].slice(0,9);const careerItems=[...lead.careers,...second.careers,...third.careers].map((x,i)=>[x,i<4?`Potential relevance: ${lead.work}`:i<8?`Potential relevance: ${second.work}`:`Potential relevance: ${third.work}`]);const sections={

live. The most revealing chapters begin when those motives compete.</p></div>`,
 armap:`${arSectionHead(2,'THE FULL CONSTELLATION','All twelve archetypes','No one character tells your whole story. Here is the full cast, from most prominent to least.')}<div class="arch-all-grid">${r.sorted.map((k,i)=>{const a=ARCHETYPES[k];return `<div class="arch-tile"><div class="arch-tile-head"><span class="archmark" style="color:${a.color};background:${a.color}20">${icon(arIcon(k),18)}</span><div><b>${a.name}</b><small>${a.tag}</small></div><span class="arch-score">${r.scores[k]}</span></div><div class="archbar-line"><span style="width:${r.scores[k]}%;background:${a.color}"></span></div><p>${a.need}</p><p class="fine">${a.gift}</p></div>`}).join('')}</div><div class="story-card"><h3>Interpreting the numbers</h3><p>Your scores map how strongly each archetype resonates with you. The further a pattern rises, the more central that theme is in your answers. Full scoring detail is available in Method & limits.</p></div>`,
 ardrivers:`${arSectionHead(3,'WHAT MOVES YOU','Motivations, values and competing needs','Four deeper themes reveal what gets you moving, what holds your attention and what you protect.')}<div class="story-card"><h3>Motivational theme index</h3>${Object.entries({leadership:['Structure & mastery','Leadership, achievement and understanding'],transformation:['Transformation & expression','Innovation, creativity and reform'],connection:['Connection & care','Intimacy, service and belonging'],freedom:['Freedom & optimism','Exploration, play and hope']}).map(([k,v])=>`<div class="facet" style="padding:12px 0"><div class="facet-head"><b>${v[0]}</b><b>${r.clusters[k]}/100</b></div><div class="archbar-line"><span style="width:${r.clusters[k]}%;background:var(--primary)"></span></div><p>${v[1]}</p></div>`).join('')}</div><div class="report-grid equal"><div class="story-card"><span class="smallcaps">PRIMARY DRIVE</span><h3>${lead.drive}</h3><p>${lead.need}</p></div><div class="story-card"><span class="smallcaps">SUPPORTING DRIVE</span><h3>${second.drive}</h3><p>${second.need}</p></div></div><h3>Where your drives might conflict</h3><div class="quote">Your ${lead.name} side pushes toward ${lead.pair.toLowerCase()}. Your ${second.name} side wants ${second.pair.toLowerCase()}. When they disagree, which one gets the final say?</div><p class="fine">The moments when both motives are active reveal far more than either score on its own.</p>`,
 arshadow:`${arSectionHead(4,'UNDER STRAIN','Shadow patterns and stress','Every advantage has a pressure point. This chapter looks at how your favourite strengths can become too dominant.')}<div class="story-card"><h3>Potential overextensions of strengths</h3><p>The qualities that serve you best can also become obstacles when you turn the volume up too high.</p>${[r.dominant,r.supporting,r.third].map(k=>`<div class="arch-shadow-note"><b>${ARCHETYPES[k].name}</b><p>${ARCHETYPES[k].shadow}</p><span class="fine">Your endorsement of the ${ARCHETYPES[k].name.toLowerCase()} stress-response item${r.shadowCount>1?'s':''}: ${r.shadow[k]}/100.</span></div>`).join('')}</div><h3>Where the pressure shows most strongly</h3>${shadowTop.length?`<div class="tile-grid">${shadowTop.map(k=>`<div class="insight-tile"><b>${ARCHETYPES[k].name}</b><p>${ARCHETYPES[k].shadow}</p></div>`).join('')}</div>`:`<p>You showed little agreement with the pressure-pattern statements. Your report is dominated by what motivates you rather than by pronounced stress responses.</p>`}<div class="method-warning">Pay attention to the shadow patterns you recognised most strongly. They point to the habits worth keeping in check when the stakes rise.</div><h3>How to use your shadow reflections</h3><p>Look for the difference between a genuine strength and the same strategy used too rigidly. Notice the trigger, the cost to yourself or others and an alternative response that would better serve the situation.</p>`,

 arleadership:`${arSectionHead(7,'AT WORK','Work style, influence and leadership','Your strongest archetypal motives shape the kind of responsibility, challenge and influence that appeals to you.')}<div class="report-grid equal"><div class="story-card"><span class="smallcaps">WHERE YOUR MOTIVATION MAY SHOW UP</span><h3>${lead.name} in action</h3><p>${lead.work}</p></div><div class="story-card"><span class="smallcaps">WHAT ADDS BALANCE</span><h3>${second.name} in action</h3><p>${second.work}</p></div></div><h3>Practical leadership experiments</h3>${arList([[`Use your ${lead.name} gift`,lead.gift],[`Balance it with ${second.name}`,second.gift],[`Invite a counterpoint`,`Ask someone whose priorities differ from yours to critique your proposed approach.`],['Measure behaviour, not a label','Choose a real outcome, such as better delegation, faster decisions or clearer feedback, and evaluate what changed.']])}<h3>Teamwork prompts</h3><p>What does this team need most right now: direction, challenge, understanding, innovation, connection or stability? A good collaborator adapts to the task rather than performing a fixed archetype.</p>`,

 armethod:`${arSectionHead(10,'TRANSPARENCY','How this assessment was built','The scoring, origins and limits behind your archetype profile, gathered in one place.')}<div class="story-card"><h3>Assessment design</h3><p>Archetype Atlas is a new, original, Jungian-inspired reflection tool inside Traitera. It explores twelve named motivational themes often used in contemporary archetype frameworks. It is not the official Pearson-Marr Archetype Indicator (PMAI) and is not endorsed by, affiliated with or equivalent to PMAI or its publishers.</p><h3>Questions and scoring</h3><p>Deep Dive uses 72 original core items plus 24 additional potential-overextension items. Quick Look uses 36 core items plus 12 potential-overextension items. Each item uses a five-point agreement response; negatively keyed items are reverse-scored. Scores are simple within-scale averages transformed onto a 0–100 display range.</p><h3>Interpreting results</h3><p>The chart shows relative endorsement of each theme. It does not measure how much of an archetype you possess, access the unconscious, establish a diagnosis or identify a scientific personality subtype. We do not have normative comparisons, formal reliability estimates, test-retest data, factor analysis or validated outcome predictions for this instrument.</p><h3>Shadow interpretation</h3><p>Potential-overextension questions describe your conscious self-reports about pressure-related habits. They are not direct evidence of Jung's theoretical unconscious shadow. Their brevity makes them particularly unsuitable for precise comparisons.</p><h3>Retesting and context</h3><p>Retake results can change because of mood, experience, situational demands, interpretation of questions or ordinary measurement noise. The work and everyday prompts offer context but do not represent independently validated subscales.</p><h3>Privacy and portability</h3><p>This standalone app runs locally in your browser. Assessments and reports live in the browser's local storage. Export JSON to retain a backup, import it in My profiles, or print this report to save a PDF.</p></div>`

function renderRadar(core){const order=['D','I','S','C'],cx=165,cy=160,r=109;const coord=(i,val)=>{const a=(i*90-90)*Math.PI/180;return [cx+Math.cos(a)*r*val/100,cy+Math.sin(a)*r*val/100]};const pol=level=>order.map((t,i)=>coord(i,level).join(',')).join(' ');const points=order.map((t,i)=>coord(i,core[t]).join(',')).join(' ');return `<svg class="radar" viewBox="0 0 330 330" role="img" aria-label="Radar plot, Drive ${core.D}%, Influence ${core.I}%, Steadiness ${core.S}%, Conscientiousness ${core.C}%"><defs><linearGradient id="radarFill" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#48dbc5" stop-opacity=".37"/><stop offset="1" stop-color="#7faeec" stop-opacity=".19"/></linearGradient></defs>${[25,50,75,100].map(level=>`<polygon points="${pol(level)}" fill="none" stroke="var(--line)" stroke-width="1"/>`).join('')}${order.map((t,i)=>{const xy=coord(i,100);return `<line x1="${cx}" y1="${cy}" x2="${xy[0]}" y2="${xy[1]}" stroke="var(--line)" stroke-width="1"/>`}).join('')}<polygon points="${points}" fill="url(#radarFill)" stroke="var(--primary)" stroke-width="2.5"/>${order.map((t,i)=>{const xy=coord(i,core[t]);return `<circle cx="${xy[0]}" cy="${xy[1]}" r="4.8" fill="${STYLE[t].color}" stroke="var(--surface)" stroke-width="2"/>`}).join('')}<text x="165" y="27" fill="var(--text)" font-size="12" font-weight="800" text-anchor="middle">EAGLE</text><text x="310" y="164" fill="var(--text)" font-size="12" font-weight="800" text-anchor="end">PEACOCK</text><text x="165" y="312" fill="var(--text)" font-size="12" font-weight="800" text-anchor="middle">DOVE</text><text x="18" y="164" fill="var(--text)" font-size="12" font-weight="800">OWL</text><text x="165" y="166" fill="var(--muted)" font-size="10" text-anchor="middle">YOUR PATTERN</text></svg>`}
function styleBars(scores){return ['D','I','S','C'].map(t=>`<div class="stylebar stylebar-visual"><div>${variablePill('flight',t,STYLE[t].label)}</div><div class="bartrack"><div class="barfill" style="width:${scores[t]}%;background:${STYLE[t].color}"></div></div><strong style="text-align:right">${scores[t]}</strong></div>`).join('')}
function contextFacets(ctx){return Object.entries(CONTEXT).map(([k,item])=>`<div class="facet"><div class="facet-head"><span>${item.name}</span><span style="color:var(--primary)">${ctx[k]}/100</span></div><p>${item.text}</p><div class="bartrack"><div class="barfill" style="width:${ctx[k]}%;background:var(--primary)"></div></div><div style="display:flex;justify-content:space-between;gap:7px;margin-top:8px" class="fine"><span>${item.low}</span><span>${item.high}</span></div></div>`).join('')}
function signalCopy(key,score){return {
pace:score>=70?'You make decisions at pace. Once you have enough information, you want movement, not another meeting. Your edge is momentum; your watch-out is leaving slower thinkers behind.':score<=35?'You report a preference for reflection before making commitments. This may improve decisions with significant consequences, but agree in advance what information is genuinely necessary.':'You report a flexible decision pace, with no strong preference toward immediate action or extended deliberation. Context may determine which approach you use.',
evidence:score>=70?'You prefer explicit reasoning, examples and supporting information. Your challenge may be knowing when the available evidence is sufficient, particularly under time pressure.':score<=35?'You are relatively comfortable using experience, impressions or patterns as inputs to a decision. For high-stakes choices, deliberately test the assumptions behind your initial reaction.':'You can work with either instinct or evidence, depending on the stakes. The skill is knowing when a fast judgement is enough and when the facts deserve another look.',
feedback:score>=70?'You value direct communication, even when the message is uncomfortable. Pair candour with curiosity so people do not confuse brevity with dismissiveness.':score<=35?'You lean toward diplomacy during difficult conversations. This can protect relationships, provided the real issue and the required action remain clear.':'You may adjust the level of directness to the relationship and setting. Check that your message is both clear and considerate.',
change:score>=70?'You welcome new methods and fresh possibilities. Change energises you. Give other people a clear path through it and your ideas have a much better chance of landing.':score<=35?'You prefer continuity and a clear reason for change. This can protect operational reliability, while small reversible experiments can prevent unnecessary stagnation.':'You balance novelty with continuity. A clear reason for change matters more to you than change for its own sake.'
}[key]}
function pressureNarrative(t,score,base){const n=STYLE[t].name;if(score>=75)return `You strongly endorsed ${n.toLowerCase()}-associated responses to pressure. ${STYLE[t].pressure} Consider when this is useful and when it could narrow your options.`;if(score>=50)return `You moderately endorsed ${n.toLowerCase()}-associated pressure responses. ${STYLE[t].pressure} The situation determines which side takes the lead.`;return `You did not strongly endorse ${n.toLowerCase()}-associated pressure responses. This is not one of the pressure responses you naturally emphasised.`}
function previousComparison(r){const previous=db.reports.filter(x=>x.assessment==='flight'&&x.id!==r.id&&x.mode===r.mode&&x.context===r.context&&x.date<r.date).sort((a,b)=>b.date-a.date)[0];if(!previous)return '';return `<div class="story-card" style="margin-top:17px"><span class="smallcaps">RETEST SNAPSHOT</span><h3 style="margin:7px 0">Compared with ${reportDate(previous.date)}</h3><div class="legend"><span><i style="background:var(--blue)"></i> Previous</span><span><i style="background:var(--primary)"></i> Current</span></div>${['D','I','S','C'].map(t=>`<div class="stress-row"><span>${STYLE[t].name}</span><div class="doublebar"><div class="base" style="width:${previous.core[t]}%"></div><div class="stress" style="background:var(--primary);width:${r.core[t]}%"></div></div><strong style="text-align:right">${r.core[t]}</strong></div>`).join('')}<p class="fine">Retest differences might reflect circumstances, self-perception or measurement noise. Because FLIGHT has not been validated for change detection, this is not a reliable measure of personal growth.</p></div>`}
function detailedOverview(r){const s=STYLE[r.strong],b=STYLE[r.secondary],spread=Math.max(...Object.values(r.core))-Math.min(...Object.values(r.core)),balanced=spread<=15;const lowEndorsement=Math.max(...Object.values(r.core))<35;const localName=r.name?htmlSafe(r.name)+', ':'';return `${sectionTitle('01 / AT A GLANCE','Your personality at a glance','The four forces behind your communication, decisions and approach to other people.')}
<div class="profile-intro"><span class="tag teal">${lowEndorsement?'LOW OVERALL ENDORSEMENT':balanced?'BROAD, BALANCED PATTERN':`${s.name.toUpperCase()} + ${b.name.toUpperCase()} BLEND`}</span><div class="report-identity">${lowEndorsement?'An Open Question':balanced?'The Adaptive Generalist':htmlSafe(r.blend[0])}</div><p>${localName}${lowEndorsement?'you endorsed relatively few statements across all four tendencies. This profile does not provide a clear leading style. The situation, question wording or your response preferences may explain the pattern.':balanced?'your four scores are comparatively close, suggesting you identify with a range of behavioural approaches. It may be especially useful to examine how your preferences shift with context.':htmlSafe(r.blend[1])}</p><p>${lowEndorsement?'Use the charts as a starting point for reflection, not a personality label.':`${s.intro} Your secondary ${b.name.toLowerCase()} tendency adds ${b.short.toLowerCase()} to that picture.`}</p><div class="hero-traits">${variableCard('flight',r.strong,'Primary tendency',s.headline)}${variableCard('flight',r.secondary,'Secondary tendency',b.headline)}</div>${characterSpotlight('flight',r.strong)}${characterDialogue('flight',r.strong,r.secondary)}</div>
<div class="report-grid" style="margin-top:18px"><div class="story-card"><h3 style="margin:0 0 4px">Your four-part signature</h3><div class="chart-container">${renderRadar(r.core)}</div><p class="fine" style="margin-bottom:0">Your style at a glance. The shape reveals which behaviours you lean into most.</p></div><div class="story-card"><h3 style="margin:0 0 16px">Core tendencies</h3>${styleBars(r.core)}<div class="dash-line"></div><div class="inline-cols"><div class="stat"><b>${STYLE[r.strong].name}</b><span>Highest core index</span></div><div class="stat"><b>${STYLE[r.secondary].name}</b><span>Secondary index</span></div></div><p class="fine">Your leading styles work together to shape how you show up.</p></div></div>
<h3>Three useful starting insights</h3><div class="tile-grid"><div class="insight-tile"><div class="index">YOUR LEADING STRENGTH</div><b>${htmlSafe(s.strengths[0][0])}</b><p>${htmlSafe(s.strengths[0][1])}</p></div><div class="insight-tile"><div class="index">YOUR SECONDARY ADVANTAGE</div><b>${htmlSafe(b.strengths[1][0])}</b><p>${htmlSafe(b.strengths[1][1])}</p></div><div class="insight-tile"><div class="index">A POTENTIAL BLIND SPOT</div><b>${htmlSafe(s.risks[0][0])}</b><p>${htmlSafe(s.risks[0][1])}</p></div><div class="insight-tile"><div class="index">YOUR DEVELOPMENT LEVER</div><b>${htmlSafe(b.growth[0])}</b><p>Make this your next move: practise it once this week and notice the difference.</p></div></div>
${previousComparison(r)}${flightAcross(r)}
<div class="story-card" style="margin-top:16px"><span class="smallcaps">THE BIG IDEA</span><h3>What you do instinctively is not the only thing you can do.</h3><p>Your advantage grows when you know when to lean into your strongest style, and when to choose another.</p></div>`}
function detailedSignature(r){const primary=STYLE[r.strong],secondary=STYLE[r.secondary];return `${sectionTitle('02 / YOUR PATTERN','Your behavioural signature','Your strongest tendencies, how they combine, and where they can clash.')}
<div class="report-grid equal"><div class="story-card">${variableCard('flight',r.strong,'Primary tendency',primary.intro)}</div><div class="story-card">${variableCard('flight',r.secondary,'Secondary tendency',secondary.intro)}</div></div>
<h3>How the four tendencies interact</h3>${['D','I','S','C'].map(t=>`<div class="story-card" style="margin:11px 0"><div style="display:flex;justify-content:space-between;align-items:center"><b style="color:${STYLE[t].color}">${STYLE[t].name} · ${STYLE[t].label}</b><span class="minichip">${r.core[t]} / 100</span></div><p>${STYLE[t].intro}</p><p><strong>A possible asset:</strong> ${STYLE[t].strengths[0][1]} <strong>Something to watch:</strong> ${STYLE[t].risks[0][1]}</p></div>`).join('')}
<h3>Your situational choices</h3><p>When the situation shifts, your first instinct becomes clearer. Here's the style you chose most often in our decision scenarios.</p><div class="inline-cols">${['D','I','S','C'].map(t=>`<div class="stat"><b style="color:${STYLE[t].color}">${r.scenarios[t]}</b><span>${STYLE[t].name} style responses</span></div>`).join('')}</div><p class="fine">You answered ${r.mode==='deep'?8:4} situational prompts. Selecting one option does not imply that the other approaches are wrong or unavailable to you.</p>
<h3>When your leading styles compete</h3><div class="quote">Your ${primary.name.toLowerCase()} tendency may pull you toward ${primary.short.toLowerCase()}, while your ${secondary.name.toLowerCase()} tendency may favour ${secondary.short.toLowerCase()}. Rather than deciding which side is the "real you", notice which approach is more effective in the specific situation.</div>`}
function detailedDecisions(r){const c=r.ctx;return `${sectionTitle('03 / THINKING & CHOICES','How you make decisions','Four additional preference indices describe your self-reported approach to speed, evidence, difficult feedback and change.')}
<div class="facet-grid">${contextFacets(c)}</div>${Object.keys(CONTEXT).map((key,idx)=>`<div class="story-card" style="margin-top:12px"><span class="smallcaps">SIGNAL ${idx+1} / 4</span><h3>${CONTEXT[key].name}</h3><p>${signalCopy(key,c[key])}</p></div>`).join('')}
<h3>Your decision-making playbook</h3><div class="tile-grid"><div class="insight-tile"><div class="index">BEFORE A DECISION</div><b>${c.evidence>=60?'Define the minimum required evidence':'Identify and test your first assumptions'}</b><p>${c.evidence>=60?'List what you know, what matters most, and what could genuinely change the outcome.':'Write down the first assumption you made and find one piece of evidence that could disprove it.'}</p></div><div class="insight-tile"><div class="index">DURING A DECISION</div><b>${c.pace>=60?'Add a short consultation checkpoint':'Set a sensible decision deadline'}</b><p>${c.pace>=60?'Invite a different view before making the final commitment.':'Prevent deliberation from extending beyond the value of additional information.'}</p></div><div class="insight-tile"><div class="index">WHEN PEOPLE DISAGREE</div><b>${c.feedback>=60?'Pair clarity with care':'Say the difficult part explicitly'}</b><p>${c.feedback>=60?'Ask how the other person sees the problem before closing the discussion.':'Make the requested action clear rather than relying on hints.'}</p></div><div class="insight-tile"><div class="index">WHEN PLANS CHANGE</div><b>${c.change>=60?'Protect what is already working':'Trial one safe new approach'}</b><p>${c.change>=60?'Communicate which established commitments should remain stable.':'Use a small, reversible experiment to explore change without unnecessary disruption.'}</p></div></div>`}
function detailedStress(r){return `${sectionTitle('04 / PRESSURE RESPONSE','Who you report becoming under pressure','When things get demanding, a different side of your personality can take the lead.')}
<div class="story-card"><h3 style="margin-top:0">Everyday tendencies versus pressure-specific responses</h3><div class="legend"><span><i style="background:var(--blue)"></i> Every day</span><span><i style="background:var(--gold)"></i> Under pressure</span></div>${['D','I','S','C'].map(t=>`<div class="stress-row"><span><b>${STYLE[t].name}</b></span><div class="doublebar"><div class="base" style="width:${r.core[t]}%"></div><div class="stress" style="width:${r.pressure[t]}%"></div></div><strong style="text-align:right">${r.pressure[t]}</strong></div>`).join('')}<p class="fine">The two sets use different question wording, so differences are descriptive and should not be interpreted as precise measured changes caused by stress.</p></div>
${['D','I','S','C'].map(t=>`<div class="story-card" style="margin-top:12px"><strong style="color:${STYLE[t].color}">${STYLE[t].name} pattern</strong><p>${pressureNarrative(t,r.pressure[t],r.core[t])}</p></div>`).join('')}
<h3>A pressure-management routine to try</h3><div class="bullets">${['Name the actual problem and distinguish what is urgent from what is merely loud.','Ask what information is missing and whether that gap really prevents action.','Check the people impact, particularly if your normal pace increases under stress.','Choose one next step, one owner and one point at which to review.'].map(x=>`<div class="bullet">${icon('check',15)}<span>${x}</span></div>`).join('')}</div><div class="quote">Reflection prompt: When you last felt under pressure, which of your usual strengths became less helpful because you used it too intensely?</div>`}
function detailedStrengths(r){const p=STYLE[r.strong],s=STYLE[r.secondary];return `${sectionTitle('05 / YOUR ASSETS','Strengths, blind spots & trade-offs','The strengths that give you an edge, and the habits that can quietly work against you.')}

<h3>Blind spots worth monitoring</h3><div class="tile-grid">${[...p.risks.slice(0,2),...s.risks.slice(0,2)].map(([head,body],idx)=>`<div class="insight-tile"><div class="index">WATCH-OUT 0${idx+1}</div><b>${htmlSafe(head)}</b><p>${htmlSafe(body)}</p></div>`).join('')}</div>

function detailedRelationships(r){const p=STYLE[r.strong],s=STYLE[r.secondary],c=r.ctx;return `${sectionTitle('06 / CONNECTION','Communication, trust & relationships','Practical suggestions for conversations with colleagues, friends and the people closest to you.')}
<div class="story-card"><span class="smallcaps">HOW I TEND TO COMMUNICATE</span><div class="quote">"I often respond well to ${c.evidence>=60?'clear reasoning and useful context':'the big picture and a practical point of view'}. I appreciate ${c.feedback>=60?'direct, respectful feedback':'thoughtful conversations that leave room for nuance'}, and I usually prefer ${c.pace>=60?'a timely decision with clear next steps':'time to consider the consequences before committing'}."</div><p>Use this as a quick way to explain how you like to communicate. The goal is mutual understanding, not asking others to adapt to you unconditionally.</p></div>
<div class="tile-grid"><div class="insight-tile"><div class="index">WHAT YOU MAY BRING</div><b>${p.strengths[0][0]}</b><p>${p.relationship}</p></div><div class="insight-tile"><div class="index">WHAT OTHERS MAY NEED</div><b>A different pace or emphasis</b><p>${s.relationship}</p></div><div class="insight-tile"><div class="index">IN A DISAGREEMENT</div><b>${c.feedback>=60?'Slow the delivery, not the honesty':'Make the message clear, not just kind'}</b><p>Identify the specific issue, explain why it matters and make space for a different interpretation.</p></div><div class="insight-tile"><div class="index">BUILDING TRUST</div><b>Keep your commitments visible</b><p>Ask what makes the other person feel informed and supported, then follow through consistently.</p></div></div>

<p class="fine">Real people have many overlapping traits. Use their stated preferences and actual behaviour rather than assuming a label explains their needs.</p>`}
function detailedWork(r){const p=STYLE[r.strong],s=STYLE[r.secondary];return `${sectionTitle('07 / YOUR ENVIRONMENT','Work style, teamwork & leadership','Ways your reported preferences might interact with the environment, responsibility and collaboration.')}

function detailedCareers(r){const p=STYLE[r.strong],s=STYLE[r.secondary],ranks=[...p.careers,...s.careers];return `${sectionTitle('08 / POSSIBLE DIRECTIONS','Career exploration','Where your behavioural strengths could give you energy and influence.')}

function detailedGrowth(r){const p=STYLE[r.strong],s=STYLE[r.secondary];const day30=p.growth[0],day60=s.growth[0],day90=p.growth[1];return `${sectionTitle('09 / WHAT NEXT','Your 30, 60 & 90-day growth plan','Build habits that make your strongest qualities even more effective.')}

function detailedMethod(r){return `${sectionTitle('10 / TRANSPARENCY','How FLIGHT works','An explanation of how these results were calculated and how cautiously they should be interpreted.')}
<div class="context-summary"><div class="stat"><b>${r.questions}</b><span>Questions answered</span></div><div class="stat"><b>${r.mode==='deep'?'Deep Dive':'Quick Look'}</b><span>Assessment version</span></div><div class="stat"><b>4 + 4</b><span>Behavioural and contextual indices</span></div><div class="stat"><b>Unvalidated</b><span>Psychometric status</span></div></div>
<h3>Scoring</h3><p>The four core behavioural scores, Eagle, Peacock, Dove and Owl, are calculated independently from agreement ratings on original self-report items. Negative-keyed items are reverse-scored. Each scale is converted to a 0 to 100 endorsement index using the minimum and maximum possible mean response. Scores are not standardised against a representative population.</p><p>The contextual scales, decision pace, evidence appetite, feedback directness and change appetite, use the same method. A separate set of pressure-specific statements creates four further indices. Situational prompts show simple counts of which style of response you chose and are not included in the main scale scores.</p><h3>What this assessment does not establish</h3><ul><li>It does not diagnose a condition or measure mental health.</li><li>It does not measure IQ, cognitive ability, job competence or integrity.</li><li>It does not establish that four fixed personality categories exist.</li><li>It does not predict career success or who someone should date, hire or trust.</li><li>The charts are descriptive, not clinical or statistically normed.</li></ul>
<h3>What would make it scientifically stronger?</h3><p>A serious validation programme would require item analysis, diverse pilot samples, scale reliability and retest studies, tests of factor structure, comparisons with established personality measures, evidence of real-world usefulness and fairness checks across groups. Until then, this is a structured reflection experience rather than a validated psychometric instrument.</p>

function renderFlightAbout(){return `<div class="wrap"><section class="section" style="max-width:800px;margin:auto;min-height:68vh"><span class="eyebrow">BEHIND THE ASSESSMENT</span><h1 class="h2">Curiosity. Not categories.</h1><p class="lead">Traitera is a home for thoughtful self-reflection. Its first assessment, FLIGHT, combines four approachable behavioural themes with questions about communication, decision preferences and reactions to pressure.</p><div class="card" style="margin:25px 0"><h3>Why we built FLIGHT differently</h3><p class="muted">People seldom fit perfectly into one type. FLIGHT independently scores four behavioural tendencies, preserves your blend and adds separate contextual measures. Situational responses are treated as illustrative, not proof of an underlying category.</p><h3>What you will receive</h3><ul class="muted"><li>Individual Eagle, Peacock, Dove and Owl indices</li><li>A blended profile and visual radar chart</li><li>Decision-making, feedback and change preference charts</li><li>Separate pressure-response indices</li><li>Strengths, potential limitations and communication guidance</li><li>Work environment, leadership, teamwork and relationships guidance</li><li>Career activity suggestions and a practical growth plan</li><li>A printable report and portable JSON export</li></ul><h3>Scientifically responsible by design</h3><p class="muted">FLIGHT is not a validated psychometric instrument. Its original questions and interpretation rules are intended for personal insight. We do not claim to measure capability or accurately predict your career, relationships or future behaviour. The 0 to 100 scores are within-scale indices, not population rankings.</p><h3>What happens to your answers?</h3><p class="muted">This edition runs entirely as a single HTML file and uses your browser's local storage. No account or server connection is involved. If you clear your browser storage, your profiles may disappear. Export a copy if you want a durable backup function newCalculate(s){const defs=NEW_DOMAINS[s.assessment],qs=dynamicItems(s.assessment,s.mode),scores={};Object.keys(defs).forEach(k=>scores[k]=scaleScore(qs,s.answers,k));const sorted=Object.keys(defs).sort((a,b)=>scores[b]-scores[a]);return {scores,sorted,dominant:sorted[0],supporting:sorted[1],scoreVersion:'original-v1',questionCount:qs.length}}

al">RECOMMENDED</span><strong>Deep Dive</strong><span>${full} items, a fuller pattern.</span></button><button class="choicecard ${optionsMode==='quick'?'active':''}" data-mode="quick"><strong>Quick Look</strong><span>${quick} items, a shorter reflection.</span></button></div><p class="fine">${meta.disclaimer} Answers and profile data are stored locally in this browser.</p><button class="btn" style="width:100%;margin-top:10px" data-start="1">Start ${optionsMode==='deep'?'Deep Dive':'Quick Look'} ${icon('arrow')}</button></div></div></div>`}
function newTest(){const qs=questionsFor(session),i=Math.min(session.index||0,qs.length-1),q=qs[i],answered=session.answers[q.id],progress=Math.round(100*Object.keys(session.answers).length/qs.length),meta=NEW_ASSESSMENTS[session.assessment];return `<div class="wrap"><div class="test-shell"><div class="test-head"><button class="btn ghost sm" data-saveexit="1">${icon('back',15)} Save & exit</button><span class="tag teal">${meta.title}</span><span class="fine">${i+1} / ${qs.length}</span></div><div class="progresslabel"><span>${NEW_META[session.assessment].discover}</span><span>${progress}% complete</span></div><div class="progress"><div class="progress-fill" style="width:${progress}%"></div></div><div class="test-stage"><span>Take your time. There are no right or wrong answers.</span><span>Question ${i+1}</span></div><article class="test-card"><div class="question-type">${NEW_META[session.assessment].question}</div><h1 class="question">${htmlSafe(q.prompt)}</h1><p class="question-note">Select the response that most closely matches your actual preferences.</p><div class="rating-grid">${meta.scaleLabels.map((t,j)=>`<button class="rating ${answered===String(j+1)?'selected':''}" data-answer="${j+1}" aria-label="${htmlSafe(t)}"><span class="rating-num">${j+1}</span><span class="rating-text">${htmlSafe(t)}</span></button>`).join('')}</div><div style="flex:1;min-height:30px"></div><div class="test-controls"><button class="btn ghost" data-prev="1" ${i===0?'disabled':''}>${icon('back',15)} Previous</button><button class="btn" data-next="1" ${answered?'':'disabled'}>${i===qs.length-1?'Generate my report':'Next question'} ${icon('arrow',15)}</button></div></article><div class="keyboard-hint">Use keys 1 to 5 to respond, Enter to continue. Progress saves automatically.</div></div></div>`}

function ringChart(score,color,label){const circumference=2*Math.PI*50;return `<div class="ring" style="--accent:${color}"><svg viewBox="0 0 130 130" role="img" aria-label="${htmlSafe(label)} ${score} out of 100"><circle cx="65" cy="65" r="50" stroke="var(--surface3)" stroke-width="12" fill="none"/><circle cx="65" cy="65" r="50" stroke="${color}" stroke-width="12" fill="none" stroke-linecap="round" stroke-dasharray="${circumference}" stroke-dashoffset="${circumference*(1-score/100)}" transform="rotate(-90 65 65)"/></svg><span><strong>${score}</strong><small>/100</small></span></div>`}
function genericRadar(r){const def=NEW_DOMAINS[r.assessment],keys=Object.keys(def),n=keys.length,cx=178,cy=170,R=113;const at=(i,p)=>{const a=-Math.PI/2+i*Math.PI*2/n;return [+(cx+R*p*Math.cos(a)).toFixed(1),+(cy+R*p*Math.sin(a)).toFixed(1)]},path=p=>keys.map((k,i)=>at(i,p).join(',')).join(' ');return `<svg class="arch-radar" viewBox="0 0 360 345" role="img" aria-label="Radar chart of all ${keys.length} dimension scores">${[.25,.5,.75,1].map(p=>`<polygon points="${path(p)}" fill="none" stroke="var(--line)" stroke-width="1"/>`).join('')}${keys.map((k,i)=>`<line x1="${cx}" y1="${cy}" x2="${at(i,1)[0]}" y2="${at(i,1)[1]}" stroke="var(--line)" />`).join('')}<polygon points="${keys.map((k,i)=>at(i,r.scores[k]/100).join(',')).join(' ')}" stroke="#35c8b8" fill="rgba(50,197,178,.22)" stroke-width="2.7"/>${keys.map((k,i)=>{const [x,y]=at(i,r.scores[k]/100),[lx,ly]=at(i,1.22);return `<circle cx="${x}" cy="${y}" r="4" fill="${def[k].color}"/><text x="${lx}" y="${ly}" text-anchor="middle" dominant-baseline="middle" fill="var(--text)" font-size="${n>=8?8.5:10}" font-weight="700">${htmlSafe(def[k].name.length>15?def[k].name.slice(0,13):def[k].name)}</text>`}).join('')}</svg>`}

function renderNewReport(){const r=currentReport||db.reports[0];if(!r)return '<div class="wrap"><div class="empty">No report yet.</div></div>';currentReport=r;const sections=newReportSections(r),meta=NEW_ASSESSMENTS[r.assessment];return `<div class="wrap"><div class="report-header"><div class="breadcrumb"><button data-go="history">My profiles</button> ${icon('arrow',13)} ${meta.title}</div><span class="eyebrow">PERSONAL INTELLIGENCE REPORT</span><h1 class="report-title">${htmlSafe(r.name||'Your')} ${htmlSafe(meta.title)}<span class="hero-accent">.</span></h1><p class="muted">${reportDate(r.date)} · ${questionsFor(r).length} questions · ${reportContextText(r)}</p><div class="report-actions"><button class="btn" data-print="1">${icon('printer',15)} Export designed PDF</button><button class="btn secondary" data-go="atlas">${icon('spark',15)} The Inner Atlas</button><button class="btn secondary" data-export="${r.id}">${icon('download',15)} Backup JSON</button><button class="btn secondary" data-copyshare="${r.id}">${icon('layers',15)} Copy summary</button></div></div>${pdfFront(r)}${pdfPreface(r)}<div class="report-layout"><nav class="report-nav" aria-label="Report sections">${NEW_REPORT_TABS.map(([id,t],i)=>`<button data-section="${id}" class="${reportSection===id?'active':''}">${String(i+1).padStart(2,'0')}&nbsp; ${htmlSafe(t)}</button>`).join('')}</nav><div class="report-main">${NEW_REPORT_TABS.map(([id])=>`<section class="report-section" id="report-${id}" tabindex="-1">${sections[id]}</section>`).join('')}</div></div></div>`}

function blueprintCard(r){const k=r.assessment,lead=NEW_ASSESSMENTS[k]?NEW_DOMAINS[k][r.dominant].name:k==='archetypes'?ARCHETYPES[r.dominant]?.name:STYLE[r.strong]?.name,sec=NEW_ASSESSMENTS[k]?NEW_DOMAINS[k][r.supporting].name:k==='archetypes'?ARCHETYPES[r.supporting]?.name:STYLE[r.secondary]?.name;return `<article class="bp-card"><div class="bp-card-top"><span class="tag teal">${htmlSafe(testLabel(k))}</span><span class="fine">${htmlSafe(new Date(r.date).toLocaleDateString('en-AU'))}</span></div><h3>${htmlSafe(lead||'Your results')} <span>+ ${htmlSafe(sec||'')}</span></h3><p>Open the full story, including your strengths, tensions and next moves.</p><button class="btn secondary sm" data-report="${r.id}">Read report ${icon('arrow',15)}</button></article>`}
function renderBlueprint(){const done=APP_TEST_ORDER.filter(k=>!!lastReport(k));const missing=APP_TEST_ORDER.filter(k=>!lastReport(k));const p=db.profile||{};const f=lastReport('flight'),a=lastReport('archetypes'),b=lastReport('bigfive'),v=lastReport('values'),c=lastReport('career');let insight='Your personal story starts here. Take one assessment and discover the first pattern.';if(b&&v)insight=`Your Big Five responses show ${NEW_DOMAINS.bigfive[b.dominant].name.toLowerCase()} as a leading theme, while your Values Compass highlights ${NEW_DOMAINS.values[v.dominant].name.toLowerCase()}. Together they explain how your natural style and priorities pull your choices in particular directions.`;else if(a&&f)insight=`FLIGHT highlighted ${STYLE[f.strong].name} tendencies and Archetype Atlas highlighted ${ARCHETYPES[a.dominant].name} motivations. One shows how you tend to act, the other what motivates you. The combination adds depth to your personal story.`;else if(done.length)insight=`You've completed ${done.length} assessment${done.length>1?'s':''}. Each gives one limited perspective on the patterns you report. Add a complementary assessment to uncover more useful questions.`;
const suggestions=[];if(c)suggestions.push(`Explore work activities aligned with your ${NEW_DOMAINS.career[c.dominant].name.toLowerCase()} interests, then check real job requirements.`);if(v)suggestions.push(`Ask whether your current routines support your ${NEW_DOMAINS.values[v.dominant].name.toLowerCase()} value.`);if(b)suggestions.push(`Try one practical counterbalance to your ${NEW_DOMAINS.bigfive[b.dominant].name.toLowerCase()} tendency.`);if(f)suggestions.push('Use your communication style to ask better questions, handle disagreement and strengthen rapport.');if(a)suggestions.push('Explore how your leading archetype drives choices, relationships and ambition.');if(!suggestions.length)suggestions.push('Begin with a Quick Look, then choose a second assessment based on what you want to understand.');
return `<div class="wrap blueprint-page"><div class="bp-hero"><div><span class="eyebrow">YOUR PERSONAL INTELLIGENCE</span><h1 class="h2">${p.preferredName?`${htmlSafe(p.preferredName)}'s`: 'Your'} evolving blueprint<span class="hero-accent">.</span></h1><p class="lead">One home for your behaviour, motivations, values, interests and personal development.</p><div class="hero-actions"><button class="btn" data-go="home">Explore assessments ${icon('arrow',16)}</button><button class="btn secondary" data-go="profile">${icon('layers',16)} Edit my details</button>${done.length?`<button class="btn secondary" data-go="atlas">${icon('spark',16)} Create The Inner Atlas</button><button class="btn secondary" data-printblueprint="1">${icon('printer',16)} Quick summary PDF</button>`:''}</div></div><div class="bp-progress"><div class="bp-progress-num">${done.length}<span> / ${APP_TEST_ORDER.length}</span></div><b>Core explorations completed</b><div class="progress" style="margin:12px 0"><div class="progress-fill" style="width:${done.length/APP_TEST_ORDER.length*100}%"></div></div><span class="fine">More tests don't make a person more complete. Each one simply adds a different lens.</span></div></div><div class="bp-columns"><section><div class="subhead"><h2 class="h3">Your discoveries</h2><span class="tag">${done.length} completed</span></div><div class="blueprint-grid">${done.length?done.map(k=>blueprintCard(lastReport(k))).join(''):`<div class="empty">Your blueprint begins with your first completed assessment.</div>`}</div><div class="card" style="margin-top:16px"><span class="eyebrow">CROSS-ASSESSMENT REFLECTION</span><h3 style="margin-top:12px">The pattern behind the patterns</h3><p class="muted">${htmlSafe(insight)}</p><p class="fine">These are independent exploratory measures. We don't average incompatible scores or manufacture a scientific composite index.</p></div></section><aside><div class="card bp-aside"><span class="eyebrow">YOUR NEXT STEP</span><h3>What might help now?</h3><div class="bullets">${suggestions.slice(0,4).map(s=>`<div class="bullet">${icon('target',15)}<span>${htmlSafe(s)}</span></div>`).join('')}</div><button class="btn secondary" style="width:100%;margin-top:20px" data-go="coach">Open Profile Guide ${icon('arrow',14)}</button></div>${missing.length?`<div class="card" style="margin-top:15px"><h3>Still to explore</h3>${missing.map(k=>`<div class="bp-missing"><span>${htmlSafe(testLabel(k))}</span><button class="btn sm secondary" data-open-assessment="${k}">Start</button></div>`).join('')}</div>`:''}</aside></div></div>${renderMobileNav()}`}
function renderDetails(){const p=db.profile||{};const f=(k,title,placeholder,help='',max=180)=>`<label class="field-label" for="p-${k}">${title}</label><input class="input" id="p-${k}" data-profile-field="${k}" value="${htmlSafe(p[k]||'')}" placeholder="${htmlSafe(placeholder)}" maxlength="${max}">${help?`<p class="fine" style="margin:5px 0 18px">${help}</p>`:'<div style="height:17px"></div>'}`;return `<div class="wrap" style="max-width:940px"><div class="breadcrumb"><button data-go="blueprint">Personal Blueprint</button> ${icon('arrow',13)} My details</div><section class="section"><span class="eyebrow">PERSONALISED, NOT INVASIVE</span><h1 class="h2">A little context goes a long way<span class="hero-accent">.</span></h1><p class="lead">Personal details are completely optional. Add only what makes the reports more useful, and decide whether any of it appears in an exported PDF.</p><div class="profile-layout"><div class="card"><h3 class="h3" style="margin-bottom:20px">About you</h3>${f('preferredName','Preferred name','How should Traitera address you?','You can also take assessments anonymously.',70)}${f('role','Work or study situation','e.g. Branch manager, apprentice, university student','For context only, not a measure of ability or career fit.',100)}<label class="field-label" for="p-stage">Current direction</label><select id="p-stage" class="input" data-profile-field="stage"><option value="">Prefer not to say</option>${['Studying or starting out','Exploring options','Building my career','Established professional','Changing direction','Taking a career break','Retired or not working'].map(v=>`<option ${p.stage===v?'selected':''}>${v}</option>`).join('')}</select><div style="height:17px"></div>${f('goal','What would you like to get out of Traitera?','e.g. Make a career change, improve my relationships','A clear goal lets guidance focus on decisions you actually face.',220)}${f('focus','One behaviour you want to develop','e.g. Listen before deciding, set better boundaries','Choose something observable that you can practise.',180)}<div class="privacy-choice"><label><input id="p-include" type="checkbox" ${p.includeInPdf?'checked':''}> Include my optional work situation and goals in exported PDF reports</label></div><div style="display:flex;flex-wrap:wrap;gap:10px;margin-top:23px"><button class="btn" data-saveprofile="1">Save my details ${icon('arrow',15)}</button><button class="btn secondary" data-go="blueprint">Back to Blueprint</button></div></div><aside><div class="card"><span class="eyebrow">PRIVACY FIRST</span><h3>What we won't ask for</h3><p class="muted">No full legal name, address, birthday, religion, diagnosis or personal identification numbers are needed to explore personality.</p><div class="dash-line"></div><h3>Where is this saved?</h3><p class="muted">In this browser's local storage. This prototype has no accounts, cloud sync, advertising trackers or live AI connection. Anyone with access to this browser profile may be able to view the saved data.</p><div class="dash-line"></div><button class="btn danger sm" data-cleardetails="1">${icon('trash',15)} Delete my optional details</button></div></aside></div></section></div>${renderMobileNav()}`}
function coachAdvice(topic){const p=db.profile||{},b=lastReport('bigfive'),v=lastReport('values'),c=lastReport('career'),f=lastReport('flight'),a=lastReport('archetypes');const snippets=[];if(topic==='career'){if(c){const d=NEW_DOMAINS.career[c.dominant];snippets.push(`Your highest reported vocational interest is ${d.name.toLowerCase()}. Explore actual tasks where ${d.short.toLowerCase()}.`);snippets.push(`Start with a brief conversation with someone doing ${careerExplore(c,1)[0].title.toLowerCase()} work, and ask which skills matter most.`)}else snippets.push('Take Career Compass first, then compare its interest themes with qualifications, income needs and actual vacancy descriptions.');if(v)snippets.push(`Look for career environments that respect your ${NEW_DOMAINS.values[v.dominant].name.toLowerCase()} value.`)}else if(topic==='leadership'){if(f)snippets.push(`Your FLIGHT results highlight ${STYLE[f.strong].name.toLowerCase()} tendencies. Ask two colleagues when this approach helps and when they need something different.`);else if(b)snippets.push(`Your Big Five responses highlight ${NEW_DOMAINS.bigfive[b.dominant].name.toLowerCase()}. The best leaders know how to adjust their style to the moment.`);else snippets.push('Ask three colleagues which leadership behaviour they most appreciate and which one they would change.');snippets.push('In your next important decision, invite a dissenting view before explaining your position.');snippets.push('Choose one outcome and one relationship signal to track over the next fortnight.')}else if(topic==='relationships'){if(v)snippets.push(`One value that matters to you is ${NEW_DOMAINS.values[v.dominant].name.toLowerCase()}. Ask someone close to you what matters most to them, without assuming their priorities are the same.`);snippets.push('Describe one specific interaction rather than assigning a personality type to the other person.');snippets.push('Ask, “When we disagree, what response from me helps you feel heard?” and listen for examples.')}else if(topic==='habits'){if(p.focus)snippets.push(`Work with your chosen behaviour: ${p.focus}. Make a tiny version you can practise in under two minutes.`);snippets.push('Choose one concrete action, an existing trigger and a simple way to record completion.');snippets.push('Review what actually happened in a week and change the environment if the habit was difficult.')}else{if(a)snippets.push(`Your archetype assessment highlighted the ${ARCHETYPES[a.dominant].name}. Notice how this pattern shapes the role you instinctively take in a group.`);if(b)snippets.push(`Your trait report emphasised ${NEW_DOMAINS.bigfive[b.dominant].name.toLowerCase()}. Put that trait to work in one decision this week.`);snippets.push('Pick a real situation you care about, write the outcome you want and identify one behaviour you can test.')}return snippets.slice(0,4)}
let guideTopic='career';
function renderCoach(){const p=db.profile||{};const topics=[['career','Career direction','briefcase'],['leadership','Leadership','target'],['relationships','Relationships','users'],['habits','Habits & growth','compass'],['reflection','Self-reflection','brain']];return `<div class="wrap guide-page"><div class="breadcrumb"><button data-go="blueprint">Personal Blueprint</button> ${icon('arrow',13)} Profile Guide</div><span class="eyebrow">YOUR PERSONAL DEVELOPMENT COMPANION</span><h1 class="h2">Turn insight into action<span class="hero-accent">.</span></h1><p class="lead">This offline guide uses your completed results and your own goals to suggest realistic reflection exercises. It is a rule-based feature, not a live AI chatbot.</p><div class="guide-layout"><div class="card"><span class="smallcaps">CHOOSE WHAT TO EXPLORE</span><div class="guide-topics">${topics.map(([k,t,i])=>`<button data-guidetopic="${k}" class="guide-topic ${guideTopic===k?'active':''}">${icon(i,18)} ${t}</button>`).join('')}</div><div class="guide-output"><div class="guide-avatar">${icon('brain',24)}</div><div><span class="eyebrow">TRAITERA PROFILE GUIDE</span><h3 style="margin:8px 0">${htmlSafe(topics.find(t=>t[0]===guideTopic)[1])}</h3>${coachAdvice(guideTopic).map((s,i)=>`<div class="guide-recommend"><span>0${i+1}</span><p>${htmlSafe(s)}</p></div>`).join('')}</div></div><div class="method-warning" style="margin-top:15px">This edition generates practical guidance directly from your saved results. It uses on-device rules, not a live AI adviser.</div></div><aside><div class="card"><span class="eyebrow">YOUR PERSONAL GOAL</span><h3>${htmlSafe(p.goal||'What would you like to improve?')}</h3><p class="muted">${p.focus?'Current focus: '+htmlSafe(p.focus):'Add a development focus to make the guidance more specific.'}</p><button class="btn secondary sm" data-go="profile">Edit goals ${icon('arrow',13)}</button></div><div class="card" style="margin-top:14px"><h3>Weekly reflection</h3><p class="fine">Private, optional, and stored in this browser.</p><textarea class="input" id="reflection-text" rows="5" maxlength="1200" placeholder="What happened this week? What will I try differently?">${htmlSafe(db.reflection||'')}</textarea><button class="btn" style="width:100%;margin-top:11px" data-savereflection="1">Save reflection</button></div></aside></div></div>${renderMobileNav()}`}
function renderCompare(){const f=db.reports.filter(r=>r.assessment==='flight'),a=db.reports.filter(r=>r.assessment==='archetypes'),b=db.reports.filter(r=>r.assessment==='bigfive');const selection=(f.length>=2?f:a.length>=2?a:b.length>=2?b:null);if(!selection)return `<div class="wrap" style="max-width:850px"><section class="section"><h1 class="h2">Compare two profiles</h1><p class="lead">This feature becomes available when two people complete the same assessment in this browser. Ask their permission before reviewing or sharing results.</p><button class="btn" data-go="home">Discover assessments</button></section></div>${renderMobileNav()}`;const r1=selection[0],r2=selection[1],k=r1.assessment,keys=k==='flight'?['D','I','S','C']:k==='archetypes'?AR_ORDER:Object.keys(NEW_DOMAINS[k]);let scale=(r,key)=>k==='flight'?r.core[key]:k==='archetypes'?r.scores[key]:r.scores[key],lab=key=>k==='flight'?STYLE[key].name:k==='archetypes'?ARCHETYPES[key].name:NEW_DOMAINS[k][key].name;return `<div class="wrap" style="max-width:980px"><section class="section"><span class="eyebrow">SHARED DISCOVERY</span><h1 class="h2">Two perspectives, one conversation<span class="hero-accent">.</span></h1><p class="lead">A side-by-side view of the two latest ${htmlSafe(testLabel(k))} reports. Discover where your styles complement one another and where better communication could bridge a difference.</p><div class="report-grid"><div class="card"><h3>${htmlSafe(r1.name||'Person one')}</h3><p class="fine">${reportDate(r1.date)}</p></div><div class="card"><h3>${htmlSafe(r2.name||'Person two')}</h3><p class="fine">${reportDate(r2.date)}</p></div></div><div class="card" style="margin:19px 0"><h3>Where preferences may differ</h3>${keys.map(key=>`<div class="compare-row"><b>${htmlSafe(lab(key))}</b><div class="compare-lanes"><div><span style="width:${scale(r1,key)}%;background:#4bd7c8"></span></div><div><span style="width:${scale(r2,key)}%;background:#ad98ed"></span></div></div><span>${scale(r1,key)} / ${scale(r2,key)}</span></div>`).join('')}<p class="fine">These are within-questionnaire scores, not objective compatibility or ability measures. Only compare the same assessment and edition cautiously.</p></div><div class="story-card"><h3>Three better conversation questions</h3><p>1. Which description feels accurate, and which feels misleading?</p><p>2. When do our styles complement each other?</p><p>3. Which adjustment would make working or living together easier?</p></div></section></div>${renderMobileNav()}`}
function assessCard(k){if(k==='flight')return `<article class="card assessment-card primary"><div class="assessment-glyph">${icon('compass',24)}</div><span class="tag teal">01 / BEHAVIOUR</span><h3>FLIGHT</h3><p>Four behavioural tendencies, decision preferences, communication patterns and responses to pressure.</p><div class="tag">36 or 72 questions</div><button class="btn" data-open-assessment="flight">${lastReport(k)?'Retake':'Start'} FLIGHT ${icon('arrow',15)}</button></article>`;if(k==='archetypes')return `<article class="card assessment-card archetype-card"><div class="assessment-glyph" style="color:var(--violet)">${icon('brain',24)}</div><span class="tag">02 / MOTIVATIONS</span><h3>Archetype Atlas</h3><p>Explore 12 Jungian-inspired identities, motivations, symbolic shadow patterns and growth themes.</p><div class="tag">48 or 96 questions</div><button class="btn secondary" data-open-assessment="archetypes">${lastReport(k)?'Retake':'Start'} Archetype Atlas ${icon('arrow',15)}</button></article>`;const v=NEW_ASSESSMENTS[k];return `<article class="card assessment-card new-assessment-card" style="--testaccent:${v.accent}"><div class="assessment-glyph" style="color:${v.accent};background:color-mix(in srgb,${v.accent} 14%,transparent)">${icon(v.icon,24)}</div><span class="tag">${v.code} / ${v.tag}</span><h3>${htmlSafe(v.title)}</h3><p>${htmlSafe(v.description)}</p><div class="tag">${dynamicItems(k,'quick').length} or ${dynamicItems(k,'deep').length} questions</div><button class="btn secondary" data-open-assessment="${k}">${lastReport(k)?'Retake':'Start'} ${htmlSafe(v.title)} ${icon('arrow',15)}</button></article>`}

${icon('arrow',15)}</button></div>`:''}<section class="section" id="assessments"><div class="subhead"><div><span class="eyebrow">THE EXPLORATION LIBRARY</span><h2 class="h2">Five lenses. One clearer picture.</h2></div><span class="tag">${total} completed reports</span></div><p class="muted" style="max-width:800px;margin:0 0 24px">These assessments explore different dimensions, not five competing ways of defining you. Start anywhere, then connect what you discover in your Blueprint.</p><div class="assessment-library">${APP_TEST_ORDER.map(assessCard).join('')}</div></section><section class="section" style="padding-top:18px"><div class="lower-features"><div class="feature-panel"><span class="eyebrow">THE REPORT EXPERIENCE</span><h2 class="h2">More than a result.<br><span class="hero-accent">A whole new perspective.</span></h2><p>Charts, ranked traits, strengths, blind spots, work environments, career ideas, relationships, reflection prompts and carefully explained scoring, all in a beautifully formatted PDF-ready report.</p><button class="btn secondary" data-go="blueprint">Explore the Blueprint ${icon('arrow',15)}</button></div><div class="feature-panel"><span class="eyebrow">YOUR DATA. YOUR CHOICE.</span><h3 class="h3">Personalisation without oversharing.</h3><p>Optional goals and work context make guidance more relevant. Your results stay in this browser until you explicitly export or delete them. No login or cloud sync in this standalone edition.</p><button class="btn secondary" data-go="profile">My details ${icon('arrow',15)}</button></div></div></section></div>${renderMobileNav()}`};

renderAbout=function(){return `<div class="wrap" style="max-width:920px"><section class="section"><span class="eyebrow">BEHIND THE PRODUCT</span><h1 class="h2">Curiosity. Not categories<span class="hero-accent">.</span></h1><p class="lead">Traitera brings five complementary personal-reflection assessments into one place. The point is to ask better questions about who you are and what you want to do next.</p><div class="card" style="margin-top:23px"><h3>Our five assessment lenses</h3><p class="muted">FLIGHT explores behavioural preferences, Archetype Atlas uses Jungian-inspired metaphors, Big Five Explorer covers major personality dimensions, Values Compass explores priorities and Career Compass explores Holland RIASEC-inspired vocational interests.</p><h3>What is established, and what isn't?</h3><p class="muted">The Big Five and vocational interest frameworks have substantial scientific backgrounds. This app's newly written questionnaire items and scoring rules have not been independently validated. FLIGHT and Archetype Atlas are reflective models and must not be used to decide who is suitable for employment.</p><h3>Career recommendations</h3><p class="muted">Career Compass provides illustrative Australian-facing occupations ranked by activities you report enjoying. Rankings are not aptitude or qualification measures and are not based on live job-market data.</p><h3>Data, consent and control</h3><p class="muted">This standalone version does not offer accounts, cloud sync, generative AI or external analytics. Data is stored in browser local storage, where other people using the same browser profile could potentially access it. Optional personal details are not required for assessment. You can exclude them from PDFs, export a backup or erase local data.</p><div class="method-warning"><strong>A note on employment and health:</strong> Do not use these scores as a diagnosis, IQ estimate, relationship compatibility measure or employment screening instrument.</div><div style="display:flex;flex-wrap:wrap;gap:10px;margin-top:18px"><button class="btn secondary" data-go="profile">My personal details</button><button class="btn danger" data-clear="1">${icon('trash',14)} Delete all local data</button></div></div></section></div>${renderMobileNav()}`};

document.addEventListener('change',function(ev){if(ev.target.id!=='backup-file')return;const file=ev.target.files?.[0];if(!file)return;if(file.size>1800000){toast('Backup exceeds the 1.8 MB limit');return}const reader=new FileReader();reader.onload=()=>{try{const data=JSON.parse(reader.result);if(data.app!=='Traitera')throw Error('Not a Traitera file');if(Array.isArray(data.reports)){const valid=[];for(const r of data.reports){if(!r||!APP_TEST_ORDER.includes(r.assessment)||!['quick','deep'].includes(r.mode)||typeof r.answers!=='object'||r.answers===null)continue;const qs=questionsFor(r);if(!qs.every(q=>q.section==='scenario'?['D','I','S','C'].includes(r.answers[q.id]):['1','2','3','4','5'].includes(r.answers[q.id])))continue;valid.push(r)}if(!valid.length)throw Error('No valid reports in backup');const ids=new Set(db.reports.map(r=>r.id));for(const r of valid){if(ids.has(r.id))continue;const clean={id:reportId(r.assessment),assessment:r.assessment,mode:r.mode,context:r.context==='everyday'?'everyday':'work',name:String(r.name||'').slice(0,70),date:Number.isFinite(r.date)?r.date:Date.now(),answers:Object.fromEntries(questionsFor(r).map(q=>[q.id,r.answers[q.id]])),...(NEW_ASSESSMENTS[r.assessment]?newCalculate(r):r.assessment==='archetypes'?archetypeCalculate(r):calculate(r))};db.reports.push(clean)}db.reports.sort((a,b)=>b.date-a.date);if(data.profile&&typeof data.profile==='object'){db.profile={preferredName:String(data.profile.preferredName||'').slice(0,70),role:String(data.profile.role||'').slice(0,100),stage:String(data.profile.stage||'').slice(0,100),goal:String(data.profile.goal||'').slice(0,220),focus:String(data.profile.focus||'').slice(0,180),includeInPdf:!!data.profile.includeInPdf}}store();go('history');toast('Backup restored successfully')}else if(data.report){const r=data.report;const qs=questionsFor(r);if(!APP_TEST_ORDER.includes(r.assessment)||!qs.every(q=>q.section==='scenario'?['D','I','S','C'].includes(r.answers?.[q.id]):['1','2','3','4','5'].includes(r.answers?.[q.id])))throw Error('Invalid report answers');const clean={id:reportId(r.assessment),assessment:r.assessment,mode:r.mode,context:r.context==='everyday'?'everyday':'work',date:Date.now(),name:String(r.name||'').slice(0,70),answers:Object.fromEntries(qs.map(q=>[q.id,r.answers[q.id]])),...(NEW_ASSESSMENTS[r.assessment]?newCalculate(r):r.assessment==='archetypes'?archetypeCalculate(r):calculate(r))};db.reports.unshift(clean);store();go('history');toast('Report restored')}else throw Error('Unsupported file')}catch(e){toast(e.message||'Unable to restore this file')}};reader.readAsText(file)});

function atlasSynthesis(R){const f=R.flight,b=R.bigfive,v=R.values,c=R.career,a=R.archetypes;const e=b?.scores.E||0,peacock=f?.core.I||0,d=f?.core.D||0,aut=v?.scores.AUT||0,interest=c?.scores.E||0,cre=v?.scores.CRE||0,variation=v?.scores.VAR||0,conventional=c?.scores.C??50;let main='Your personality has a distinctive shape. The more you explore it, the more the pieces connect.',details='Start with the way you naturally approach people and problems. Every completed assessment adds another dimension to this story.';
if(e>=70&&peacock>=70&&interest>=65){main='You are built for connection, influence and forward motion.';details='You draw energy from people, enjoy shaping the conversation and want your ideas to go somewhere. Across behaviour, personality and career interests, the same theme keeps surfacing: you want to participate, persuade and make things happen. Your advantage is generating momentum. Your challenge is knowing when to step back and let someone else take the lead.'}

else if(v&&v.scores.AUT>=70&&v.scores.CON>=60)friction={title:'Independence and closeness can pull in different directions.',first:'Freedom to choose',second:'Meaningful connection',body:'You want freedom, but you also care about meaningful connection. Those needs are not opposites, until a decision affects someone close to you. Your strongest move is to explain the independence you need while protecting the commitments that matter to both of you.',support:'Values Compass autonomy and connection indices.'};
else if(b&&b.scores.O>=65&&v&&v.scores.SEC>=65)friction={title:'Novelty meets the need for certainty.',first:'Exploring the unfamiliar',second:'Protecting what is secure',body:'New experiences appeal to you, but you also value having something secure to come back to. You are at your best when you can explore without putting your foundations at unnecessary risk. Choose a stable base, then create room to experiment.',support:'Big Five openness and Values Compass security indices.'};

const strengths=[];if(f&&(f.core.I>=70||f.core.D>=70))strengths.push(['Making things happen','You favour action over endless discussion. When people need a clear next step, your instinct is to create one.','Channel it: close important conversations with a decision, an owner and a deadline.']);if(b&&b.scores.E>=70)strengths.push(['Energy through connection','People and conversation energise you. Working with others is not just a task to complete; it is part of what makes the work interesting.','Channel it: turn a promising conversation into a meaningful relationship, not just another contact.']);if(a&&['magician','creator','explorer','sage'].includes(a.dominant))strengths.push(['Seeing a different future',`Your ${ARCHETYPES[a.dominant].name} archetype highlights your attraction to possibility, discovery and change. You are interested in what things could become, not only what they are today.`, 'Channel it: choose the one idea with the clearest potential, then commit to making it real.']);if(v&&v.scores.AUT>=65)strengths.push(['Independent direction','You value making your own calls and having room to back your judgement. Ownership motivates you more than being closely managed.','Channel it: choose where you need control, then give others genuine ownership too.']);if(c&&c.scores.I>=65)strengths.push(['Investigative curiosity','You enjoy understanding how things work and getting beneath the obvious explanation. Complex questions hold your attention.','Channel it: protect time for the problems that need your curiosity, rather than using analysis to avoid a decision.']);while(strengths.length<3)strengths.push([['Balanced perspective','Intentional adaptation','Practical curiosity'][strengths.length],'Your style is a starting point, not a limit. Being adaptable is about choosing the right response for the moment.','Use it: identify one situation where a different approach would serve you better.']);

<section class="atlas-chapter" id="atlas-thelenses"><div class="chap-number">CHAPTER 02 / THE CONSTELLATION</div><h2>Five lenses. Five different kinds of insight.</h2><p class="atlas-intro">Five perspectives reveal different sides of you: how you act, what you value, what energises you, the stories that resonate with you, and the kind of work you enjoy.</p><div class="atlas-grid"><div class="atlas-panel"><span class="atlas-stamp">Behaviour / FLIGHT</span>${atlasBars(f,4)}<p>How you describe your communication and action preferences.</p></div><div class="atlas-panel"><span class="atlas-stamp">Inner narratives / Archetype Atlas</span>${atlasBars(a,4)}<p>The character patterns and personal stories you most identify with.</p></div><div class="atlas-panel"><span class="atlas-stamp">Broad personality / Big Five</span>${atlasBars(b,5)}<p>The underlying traits shaping your everyday preferences.</p></div><div class="atlas-panel"><span class="atlas-stamp">Personal priorities / Values</span>${atlasBars(v,5)}<p>The priorities you rated highly, and the trade-offs they might create.</p></div></div><div class="atlas-panel atlas-lens-career" style="margin-top:14px"><span class="atlas-stamp">Work interest signature / Career Compass</span>${atlasBars(c,6)}</div></section>
<section class="atlas-chapter"><div class="chap-number">CHAPTER 03 / THE PERSONALITY ENGINE</div><h2>What gives you energy, and what gives it direction?</h2><div class="atlas-grid"><div class="atlas-panel"><span class="atlas-stamp">Your Big Five shape</span><div class="atlas-radarwrap">${atlasRadar(b)}</div></div><div class="atlas-panel"><span class="atlas-stamp">The priorities that matter most</span>${atlasBars(v,6)}<div class="atlas-note" style="margin-top:16px"><strong>Why this matters</strong><p>Traits describe tendencies. Values describe priorities. Neither alone tells us what makes a good decision for you.</p></div></div></div><div class="atlas-reflection"><span class="atlas-stamp">A MOMENT OF SELF-REFLECTION</span><div class="q">When your preferred behaviour clashes with what matters most, which one usually wins?</div></div></section>
