<section class="atlas-chapter"><div class="chap-number">CHAPTER 05 / STRENGTH & SHADOW</div><h2>What comes naturally. What still takes intention.</h2><p class="atlas-intro">The qualities that give you an edge can also trip you up when you rely on them too heavily. Here's how to make them work for you.</p><div class="atlas-grid three">${S.strengths.map((q,i)=>`<div class="atlas-panel"><span class="atlas-stamp">YOUR ADVANTAGE / 0${i+1}</span><h3>${htmlSafe(q[0])}</h3><p>${htmlSafe(q[1])}</p><div style="height:1px;background:var(--line);margin:15px 0"></div><span class="atlas-stamp">HOW TO USE IT</span><p>${htmlSafe(q[2])}</p></div>`).join('')}</div><div class="atlas-note" style="margin-top:20px"><strong>About your shadow</strong><p>Every defining quality can be overplayed. Decisiveness can crowd out other voices. Curiosity can scatter focus. Generosity can erode boundaries. The challenge is knowing when to dial a strength up, and when to pull it back.</p></div><div class="atlas-reflection"><span class="atlas-stamp">HARD QUESTION</span><div class="q">Which personal strength do you lean on so heavily that it occasionally stops serving you?</div></div></section>

<section class="atlas-chapter" id="atlas-thework"><div class="chap-number">CHAPTER 07 / WORK & DIRECTION</div><h2>What kind of work might keep you interested?</h2><p class="atlas-intro">${htmlSafe(S.path)}. Your interests point toward the work that holds your attention. Match that energy with your skills, experience and ambitions.</p><div class="atlas-grid"><div class="atlas-panel"><span class="atlas-stamp">Interest landscape</span>${atlasBars(c,6)}</div><div class="atlas-panel"><span class="atlas-stamp">Work themes to explore</span><p>${htmlSafe(env)}</p><div style="height:1px;background:var(--line);margin:16px 0"></div><span class="atlas-stamp">Illustrative job families</span><div class="atlas-careers" style="margin-top:10px">${jobs.length?jobs.map(j=>`<div class="atlas-job"><div><h4>${htmlSafe(j.title)}</h4><p>${htmlSafe(j.why)}</p></div><div class="score">${j.interestIndex}</div></div>`).join(''):'<p>Complete Career Compass to see example job families.</p>'}</div></div></div><p class="atlas-smallprint" style="margin-top:10px">These are interest matches, not job offers. Use your skills, experience, location and income goals to turn a promising direction into a realistic move.</p></section>
<section class="atlas-chapter"><div class="chap-number">CHAPTER 08 / WHEN THE PRESSURE RISES</div><h2>The version of you that shows up when things get difficult.</h2><p class="atlas-intro">Pressure changes priorities. Compare your everyday style with the responses you choose when the stakes rise.</p><div class="atlas-grid"><div class="atlas-panel"><span class="atlas-stamp">FLIGHT / everyday tendencies</span>${f?['D','I','S','C'].map(k=>atlasBar('flight',k,STYLE[k].name,f.core[k],'#50d6c6',STYLE[k].label)).join(''):'<p>Complete FLIGHT to add this comparison.</p>'}</div><div class="atlas-panel"><span class="atlas-stamp">FLIGHT / pressure responses</span>${f?['D','I','S','C'].map(k=>atlasBar('flight',k,STYLE[k].name,f.pressure[k],'#ac9aee',STYLE[k].label)).join(''):'<p>Complete FLIGHT to add this comparison.</p>'}</div></div>${f?`<div class="atlas-note" style="margin-top:18px"><strong>A useful distinction</strong><p>In the real-world scenarios you chose ${f.scenarios.D||0} Eagle, ${f.scenarios.I||0} Peacock, ${f.scenarios.S||0} Dove and ${f.scenarios.C||0} Owl responses. These choices reveal the approach you selected first in demanding situations. Use them to understand which instinct you reach for when speed matters.</p></div>`:''}<div class="atlas-reflection"><span class="atlas-stamp">TEST IT IN LIFE</span><div class="q">Under pressure, what do the people around you need that you might instinctively overlook?</div></div></section>
<section class="atlas-chapter" id="atlas-theplan"><div class="chap-number">CHAPTER 09 / YOUR NEXT CHAPTER</div><h2>Insight means more when it changes something.</h2><p class="atlas-intro">You don't need twelve development goals. Start with one behaviour you can notice and a small experiment you can repeat.</p><div class="atlas-step"><span>THIS WEEK</span><div><h3>Turn your biggest insight into action.</h3><p>${htmlSafe(S.action)}</p></div></div><div class="atlas-step"><span>30 DAYS</span><div><h3>Ask for an outside perspective.</h3><p>Ask two people who know you in different settings where they see your greatest strength, and where it works against you.</p></div></div><div class="atlas-step"><span>90 DAYS</span><div><h3>Track behaviour, not just scores.</h3><p>Review a decision, relationship or work habit that matters to you. Note what you tried, what happened and what you'll keep or change.</p></div></div><div class="atlas-pullquote">The goal isn't to become a better archetype. It's to become more intentional about how you live.</div><div class="atlas-reflection"><span class="atlas-stamp">YOUR FINAL QUESTION</span><div class="q">If you acted on just one insight from this report, which would make the biggest practical difference?</div></div></section>

function careerSignals(R,role,lens){
 const spec=role.sig[lens];if(!spec||!R[lens])return [];
 const scores=lens==='flight'?R[lens].core:R[lens].scores;if(!scores)return [];
 return spec.split(/\s+/).map(entry=>{const [key,rawWeight]=entry.split(':');const value=Number(scores[key]);const weight=Number(rawWeight);if(!Number.isFinite(value)||!Number.isFinite(weight)||weight<=0)return null;
  const source=variableSource(lens,key);if(!source)return null;
  return {lens,key,name:source.name,score:value,weight,color:source.color,points:value*weight};
 }).filter(Boolean).sort((x,y)=>y.points-x.points);
}

 };

function validateBenchmarkPack(input){if(!input||input.type!=='TraiteraBenchmarkPack'||input.version!==1||typeof input.assessments!=='object')throw Error('Expected an aggregated TraiteraBenchmarkPack v1 JSON file');const out={};for(const kind of APP_TEST_ORDER){const src=input.assessments[kind];if(!src)continue;const names=kind==='flight'?STYLE:kind==='archetypes'?ARCHETYPES:NEW_DOMAINS[kind];if(!Number.isInteger(src.n)||src.n<30||src.n>100000000)continue;const results={};for(const k of Object.keys(names)){const d=src.dimensions?.[k];if(!d)continue;const nums=['mean','median','p25','p75'].map(x=>d[x]);if(!nums.every(x=>typeof x==='number'&&Number.isFinite(x)&&x>=0&&x<=100))continue;if(!(d.p25<=d.median&&d.median<=d.p75))continue;let hist=null;if(Array.isArray(d.histogram)&&d.histogram.length===10&&d.histogram.every(x=>Number.isInteger(x)&&x>=0)&&d.histogram.reduce((a,b)=>a+b,0)===src.n)hist=d.histogram;results[k]={mean:d.mean,median:d.median,p25:d.p25,p75:d.p75,histogram:hist}}if(Object.keys(results).length===Object.keys(names).length)out[kind]={n:src.n,period:String(src.period||'Not specified').slice(0,80),group:String(src.group||'Consenting Traitera respondents').slice(0,80),source:String(src.source||'Independent benchmark provider').slice(0,120),dimensions:results}}if(!Object.keys(out).length)throw Error('No complete assessment benchmark group with n ≥ 30 was found');return {type:'TraiteraBenchmarkPack',version:1,assessments:out}}
function importBenchmark(file){if(!file||file.size>200000){toast('Choose an aggregated benchmark JSON below 200 KB');return}const reader=new FileReader();reader.onload=()=>{try{const pack=validateBenchmarkPack(JSON.parse(String(reader.result)));db.benchmarkPack56=pack;store();render();toast('Aggregated benchmarks imported locally')}catch(e){toast(e.message)}};reader.readAsText(file)}
function percentileFromHistogram(hist,score){if(!hist)return null;const n=hist.reduce((a,b)=>a+b,0);const bin=Math.max(0,Math.min(9,Math.floor(score/10)));const below=hist.slice(0,bin).reduce((a,b)=>a+b,0),same=hist[bin];return Math.round((below+same*Math.min(1,(score-bin*10)/10))*100/n)}
function renderBenchmark(){const R=findAtlasReports(),mine=numericProfile(R),pack=db.benchmarkPack56,ready=pack?APP_TEST_ORDER.filter(k=>mine[k]&&pack.assessments[k]):[];if(ready.length&&!ready.includes(comparisonTest))comparisonTest=ready[0];const one=ready.length?pack.assessments[comparisonTest]:null;return extraLayout('How Do You Compare?','Put your personality profile in context with genuine Traitera user benchmarks.',`<div class="notice56"><strong>Benchmarks are not live yet.</strong> This offline app has no central user database. Real comparisons become available when you import an independently produced, consented, aggregate-only reference pack. No invented averages or percentiles are displayed.</div><div class="share56"><div><h3>Comparison group</h3>${one?`<p><strong>${htmlSafe(one.group)}</strong><br>${one.n.toLocaleString('en-AU')} respondents · ${htmlSafe(one.period)}<br><span class="fine">Source: ${htmlSafe(one.source)}</span></p>`:'<p>No aggregate benchmark data loaded for this profile.</p>'}<label class="btn secondary" for="benchmark-import56">${icon('download',15)} Import aggregate benchmark pack</label><input id="benchmark-import56" type="file" accept=".json,application/json" class="hide"></div><div><h3>What the comparison means</h3><p>We compare your dimension score with the same questionnaire version’s median, typical middle range and mean. A percentile is shown only when an actual aggregated distribution was provided.</p><p class="fine">Minimum comparison group size: 30. Smaller or incomplete packs are rejected.</p>${pack?'<button class="btn secondary sm" data-benchmark-clear="1">Remove benchmark pack</button>':''}</div></div>${one?`<section class="extra-feature block56"><h2>Your scores versus the reference group</h2><div class="extra-tabs">${ready.map(k=>`<button data-compare-kind="${k}" class="${comparisonTest===k?'active':''}">${htmlSafe(testLabel(k))}</button>`).join('')}</div><div class="compare-legend56"><span style="--color56:#53d3c8">Your score</span><span style="--color56:#a9b7d9">Group median</span><span>Shaded range = middle 50%</span></div>${Object.keys(one.dimensions).map(k=>{const d=one.dimensions[k],you=mine[comparisonTest][k],v=variableSource(comparisonTest,k),pct=percentileFromHistogram(d.histogram,you);return `<div class="compare-row56"><div class="compare-row56-head">${variablePill(comparisonTest,k)}<span>${you}/100 · median ${Math.round(d.median)}</span></div><div class="benchmark-track56"><div class="benchmark-range56" style="left:${d.p25}%;width:${d.p75-d.p25}%"></div><div class="benchmark-you56" style="left:${you}%"></div><div class="benchmark-median56" style="left:${d.median}%"></div></div><p class="fine" style="margin-top:4px">Mean ${d.mean.toFixed(1)} · middle 50% ${d.p25}–${d.p75}${pct!==null?` · approximately ${pct}th percentile`:''}</p></div>`}).join('')}<p class="fine">Percentiles based on imported ten-bin aggregated histograms are approximate. Results are relative to the displayed sample, not the general public.</p></section>`:''}<div class="notice56">Future hosted Traitera accounts could offer consenting-user benchmarks automatically. This local prototype deliberately requires externally produced aggregates instead of collecting anyone’s answers silently.</div>`)}
// Simple prompts to guide offline benchmark producers; no synthetic observations shipped.
const originalStudio56=renderStudio;renderStudio=function(){let h=originalStudio56();return h.replace('<div class="edition-controls">',`<div class="extra-studio-cards"><article><span class="eyebrow">DISCOVER YOUR CAST</span><h3>Meet the personalities behind your scores</h3><p>Portraits, character voices, gifts, shadows and downloadable profile cards.</p><button class="btn secondary sm" data-go="cast">Explore your Inner Cast ${icon('arrow',15)}</button></article><article><span class="eyebrow">FIND YOUR PARALLELS</span><h3>Famous Parallels</h3><p>Meet public and fictional figures whose visible stories echo your themes.</p><button class="btn secondary sm" data-go="parallels">Discover parallels ${icon('arrow',15)}</button></article><article><span class="eyebrow">GAIN PERSPECTIVE</span><h3>Compare your personality</h3><p>Side-by-side friend profiles and real user benchmarks, never invented scores.</p><div class="extra-actions"><button class="btn secondary sm" data-go="friends">Compare with a friend</button><button class="btn secondary sm" data-go="benchmarks">Benchmark</button></div></article></div><div class="edition-controls">`)};
const oldHome56=renderHome;renderHome=function(){let h=oldHome56();const shortcut=`<div class="extra-home-actions"><button class="btn secondary" data-go="cast">${icon('users',16)} Your Inner Cast</button><button class="btn secondary" data-go="friends">${icon('link',16)} Compare with Friends</button><button class="btn secondary" data-go="parallels">${icon('spark',16)} Famous Parallels</button></div>`;return h.replace('<section class="journey-section">',shortcut+'<section class="journey-section">')};
const beforeExtra56=render;
render=function(){const extras={cast:renderCast,parallels:renderParallels,friends:renderFriendCompare,benchmarks:renderBenchmark};if(extras[screen]){document.body.classList.remove('atlas-print','edition-print');themeApply();document.body.classList.toggle('has-mobile-nav',true);$('#app').innerHTML=extras[screen]();updateNav();bindEvents();return}beforeExtra56()};
document.addEventListener('click',ev=>{const el=ev.target.closest('button');if(!el)return;const d=el.dataset;if(d.castKey){castDetail=d.castKey;if(screen==='atlas')go('cast');else render();ev.stopImmediatePropagation();return}if(d.castScope){castScope=d.castScope;render();ev.stopImmediatePropagation();return}if(d.matchMode){matchMode=d.matchMode;render();ev.stopImmediatePropagation();return}if(d.compareKind){comparisonTest=d.compareKind;render();ev.stopImmediatePropagation();return}if(d.exportCard){const [kind,key]=d.exportCard.split(':');exportProfilePng(kind,key);ev.stopImmediatePropagation();return}if(d.exportPeer){peerSharingExport();ev.stopImmediatePropagation();return}if(d.peerClear){delete db.peer56;store();render();ev.stopImmediatePropagation();return}if(d.benchmarkClear){delete db.benchmarkPack56;store();render();ev.stopImmediatePropagation();return}},true);
document.addEventListener('change',ev=>{const el=ev.target;if(el.id==='v56-person'){atlasSubject=el.value;castDetail=null;render();return}if(el.id==='peer-import56'){importPeer(el.files?.[0]);return}if(el.id==='benchmark-import56'){importBenchmark(el.files?.[0]);return}},true);
render();

</script>
